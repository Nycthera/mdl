name: Tests, Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Validate source version and release tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          args=(--check-only --github-output "$GITHUB_OUTPUT")
          if [[ "$REF_TYPE" == tag ]]; then
            args+=(--tag "$REF_NAME")
          fi
          python scripts/release.py "${args[@]}"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Build and verify release assets
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: python scripts/release.py --tag "$RELEASE_TAG"
      - name: Upload tested assets
        uses: actions/upload-artifact@v4
        with:
          name: mdl-${{ steps.version.outputs.tag }}
          path: |
            dist/release/mdl.py
            dist/release/requirements.txt
            dist/release/LICENSE
            dist/release/INSTALL.txt
            dist/release/SHA256SUMS
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested assets
        uses: actions/download-artifact@v4
        with:
          name: mdl-${{ needs.test-build.outputs.tag }}
          path: assets
      - name: Verify assets
        working-directory: assets
        run: sha256sum --check SHA256SUMS
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.test-build.outputs.tag }}
          PRERELEASE: ${{ needs.test-build.outputs.prerelease }}
        run: |
          args=(--verify-tag --title "MDL $RELEASE_TAG" --generate-notes)
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" assets/mdl.py assets/requirements.txt \
            assets/LICENSE assets/INSTALL.txt assets/SHA256SUMS "${args[@]}"
