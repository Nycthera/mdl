[project]
name = "mdl"
version = "3.5.1"
description = "A multi-source manga downloader"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-only"
authors = [{ name = "Nycthera" }]
dependencies = [
    "aiohttp>=3.13.0",
    "playwright>=1.58.0",
    "playwright-stealth>=2.0.2",
    "rich>=13.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.13.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["asyncio: async tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
